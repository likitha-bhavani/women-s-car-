<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Women's Care</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: #ffe6f2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      background-color: #fff;
      width: 100%;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #eee;
    }

    .logo {
      display: flex;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      color: #ff66b2;
    }

    .logo img {
      height: 40px;
      margin-right: 10px;
    }

    .login-container {
      margin-top: 40px;
      width: 90%;
      max-width: 400px;
      background-color: #fff;
      padding: 40px 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    .login-container h2 {
      color: #ff66b2;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #444;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      background-color: #ff66b2;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #ff3399;
    }

    .login-container p {
      margin-top: 20px;
      font-size: 14px;
    }

    .login-container a {
      color: #ff66b2;
      text-decoration: none;
      font-weight: bold;
    }

    .login-container a:hover {
      text-decoration: underline;
    }

    .back-link {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 20px;
      color: #ff66b2;
    }

    @media (max-width: 500px) {
      .login-container {
        padding: 30px 20px;
      }

      .back-link {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img alt="W logo representing Women's Care" src="https://storage.googleapis.com/a1aa/image/D7CxMwbcUe28f09Jq1qqpiFDwQtaX6FerH4ePwd7LdyOglNQB.jpg" />
      Women's Care
    </div>
  </header>

  <a href="main_home.html" class="back-link"><i class="fas fa-arrow-left"></i></a>

  <div class="login-container">
    <h2>Login to Your Account</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
    <p>New user? <a href="p_sig2.html" target="sai_a">Register</a></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      // Set correct credentials
      const correctEmail = "user@example.com";
      const correctPassword = "password123";

      if (email === correctEmail && password === correctPassword) {
        window.location.href = "home.html.html";
      } else {
        alert("Invalid email or password. Please try again.");
      }
    });
  </script>

</body>
</html>
