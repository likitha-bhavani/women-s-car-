<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Women's Care</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: #ffe6f2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      background-color: #fff;
      width: 100%;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #eee;
    }

    .logo {
      height: 80px;
    }
    .login-container a {
        color: #ff66b2;
        text-decoration: none;
        font-weight: bold;
      }
  
      .login-container a:hover {
        text-decoration: underline;
      }

    .signup-container {
      margin-top: 40px;
      width: 90%;
      max-width: 500px;
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    h2 {
      color: #ff66b2;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
      color: #444;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-back {
      background-color: #ccc;
    }

    .btn-next, .btn-submit {
      background-color: #ff66b2;
      color: #fff;
    }

    .btn-next:hover, .btn-submit:hover {
      background-color: #ff3399;
    }

    @media (max-width: 500px) {
      .signup-container {
        padding: 20px;
      }

      button {
        width: 48%;
      }
    }
    .back-link {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 20px;
        color: #ff66b2;
        text-decoration: none;
      }
      
      .back-link:hover {
        color: #ff3399;
      }
      
  </style>
</head>
<body>
    <a href="main_home.html" class="back-link"><i class="fas fa-arrow-left"></i></a>

    <header>
        <div class="logo">
          <img alt="W logo representing Women's Care" height="30" src="https://storage.googleapis.com/a1aa/image/D7CxMwbcUe28f09Jq1qqpiFDwQtaX6FerH4ePwd7LdyOglNQB.jpg" width="30" />
          Women's Care
      </div>
      </header>
    
     
  <div class="signup-container">
    <form id="signupForm">
      <!-- Step 1: Personal Info -->
      <div class="step active" id="step1">
        <h2>Personal Details</h2>
        <div class="form-group">
          <label>Name:</label>
          <input type="text" id="name">
        </div>
        <div class="form-group">
          <label>Age:</label>
          <input type="number" id="age">
        </div>
        <div class="form-group">
          <label>Phone No:</label>
          <input type="tel" id="phone">
        </div>
        <div class="form-group">
          <label>Married:</label>
          <select id="married">
            <option value="">Select</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
        <div class="form-group">
          <label>Any Health Issues in the Past?</label>
          <select id="health-issues">
            <option value="">Select</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
        <div class="form-group" id="issueDetailsGroup" style="display:none;">
          <label>If yes, what are they?</label>
          <textarea id="issue-details" rows="3"></textarea>
        </div>
        <div class="btn-group">
          <button type="button" class="btn-next" onclick="nextStep(1)">Next</button>
        </div>
      </div>

      <!-- Step 2: Address Info -->
      <div class="step" id="step2">
        <h2>Address Details</h2>
        <div class="form-group">
          <label>Country:</label>
          <input type="text" id="country">
        </div>
        <div class="form-group">
          <label>State:</label>
          <input type="text" id="state">
        </div>
        <div class="form-group">
          <label>Address:</label>
          <textarea id="address" rows="3"></textarea>
        </div>
        <div class="btn-group">
          <button type="button" class="btn-back" onclick="prevStep(2)">Back</button>
          <button type="button" class="btn-next" onclick="nextStep(2)">Next</button>
        </div>
      </div>

      <!-- Step 3: Account Info -->
      <div class="step" id="step3">
        <h2>Account Details</h2>
        <div class="form-group">
          <label>Email:</label>
          <input type="email" id="email">
        </div>
        <div class="form-group">
          <label>Password:</label>
          <input type="password" id="password">
        </div>
        <div class="form-group">
          <label>Confirm Password:</label>
          <input type="password" id="confirm-password">
        </div>
        <div class="btn-group">
          <button type="button" class="btn-back" onclick="prevStep(3)">Back</button>
          <button type="button" class="btn-submit" onclick="submitForm()">Submit</button>
        </div>
      </div>
    </form>
  </div>

  <script>
    function nextStep(current) {
      if (!validateStep(current)) return;
      document.getElementById(`step${current}`).classList.remove("active");
      document.getElementById(`step${current + 1}`).classList.add("active");
    }

    function prevStep(current) {
      document.getElementById(`step${current}`).classList.remove("active");
      document.getElementById(`step${current - 1}`).classList.add("active");
    }

    function validateStep(step) {
      if (step === 1) {
        const name = document.getElementById("name").value.trim();
        const age = document.getElementById("age").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const married = document.getElementById("married").value;
        const issues = document.getElementById("health-issues").value;
        const issueDetails = document.getElementById("issue-details").value.trim();

        if (!name || !age || !phone || !married || !issues || (issues === "Yes" && !issueDetails)) {
          alert("Please fill all personal details.");
          return false;
        }
      }

      if (step === 2) {
        const country = document.getElementById("country").value.trim();
        const state = document.getElementById("state").value.trim();
        const address = document.getElementById("address").value.trim();

        if (!country || !state || !address) {
          alert("Please fill all address details.");
          return false;
        }
      }

      return true;
    }

    function submitForm() {
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value;
      const confirm = document.getElementById("confirm-password").value;

      if (!email || !pass || !confirm) {
        alert("Please fill all account details.");
        return;
      }

      if (pass !== confirm) {
        alert("Passwords do not match.");
        return;
      }

      alert("Submitted Successfully!");
    }

    document.getElementById("health-issues").addEventListener("change", function () {
      const issueDetailsGroup = document.getElementById("issueDetailsGroup");
      if (this.value === "Yes") {
        issueDetailsGroup.style.display = "block";
      } else {
        issueDetailsGroup.style.display = "none";
        document.getElementById("issue-details").value = "";
      }
    });
  </script>

</body>
</html>
